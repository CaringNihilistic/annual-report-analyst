# Lint and unit tests on every push to master and every pull request.
# Unit tests need no network, database or API keys (LLM and embeddings are mocked).
# The eval gate (python -m evals.gate) needs the database and parsed reports, so it is
# run locally before merging; see README "Evaluation".
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install (CPU-only torch, no Docling)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt "pandas>=2.0" "pytest>=8.0" "ruff>=0.6" "httpx>=0.27"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q
