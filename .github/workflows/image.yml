# Build the app image and publish it to GitHub Container Registry (ghcr.io).
# The AWS server pulls this image instead of building it (a small server would take ~15 min).
# Runs on pushes to master that touch the image, or by hand (Actions tab > Run workflow).
name: Image

on:
  push:
    branches: [master, m6-deploy]  # TODO at merge: drop m6-deploy
    paths: [Dockerfile, .dockerignore, requirements-app.txt, "app/**", "ingest/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push to ghcr.io with the built-in GITHUB_TOKEN; no personal token

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry names must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
